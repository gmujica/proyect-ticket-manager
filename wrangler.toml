# Pages Functions configuration. The static build in `dist` is served as before;
# everything under `functions/` becomes an endpoint under the same origin, which
# is why the frontend needs no CORS handling and the session cookie is first
# party.
name = "proyect-ticket-manager"
pages_build_output_dir = "dist"
compatibility_date = "2026-07-31"

# `database_id` below is a placeholder until the database actually exists. Create
# it with:
#
#   npx wrangler d1 create ptm-board
#
# and paste the id it prints here. Local development does not use this id at all
# (`--local` keeps its own SQLite file under .wrangler/), so the placeholder is
# only a problem when deploying.
[[d1_databases]]
binding = "DB"
database_name = "ptm-board"
database_id = "REPLACE_WITH_ID_FROM_WRANGLER_D1_CREATE"
migrations_dir = "migrations"
