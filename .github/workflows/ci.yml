name: CI

on:
  push:
    branches: [master]
  pull_request:

# A second push to the same branch cancels the run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the local dev version. Vite 8 and jsdom 29 both need
          # >=20.19, so anything older than Node 20 will not install.
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # Catches build-only failures the tests cannot see, such as a bad import
      # path that Vitest resolves but Rollup does not.
      - run: npm run build