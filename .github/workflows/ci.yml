name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

# A second push to the same branch cancels the run still in flight — except on
# pushes, which are the runs that deploy. Killing one of those halfway is worse
# than paying for a minute of CI that a newer commit has already superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the local dev version. Vite 8 and jsdom 29 both need
          # >=20.19, so anything older than Node 20 will not install.
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # Catches build-only failures the tests cannot see, such as a bad import
      # path that Vitest resolves but Rollup does not.
      - run: npm run build

  # Every push to `dev` uploads a new version of the Worker and points the `dev`
  # alias at it. A version is not a deployment: production keeps serving
  # whatever `master` last deployed, untouched. The alias URL is stable across
  # pushes, so a link shared once goes on showing the latest dev build.
  preview:
    needs: check
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    # Puts the link on the run itself and on the repository's Environments page,
    # which is a shorter path to it than opening the job log.
    environment:
      name: preview
      url: https://dev-proyect-ticket-manager.gmujica.workers.dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `--mode preview` is the whole difference from the production build: it
      # reads .env.preview, so the bundle talks to ptm-api-dev instead of the
      # production API. A plain `npm run build` here would have the preview
      # writing to real boards.
      - run: npm run build:preview

      # `--tag` and `--message` are the only thread back to here. Cloudflare
      # records the version but knows nothing of the build that produced it, so
      # without them its Deployments tab is a list of bare hashes and timestamps.
      # The subject is cut at 80 characters because commit subjects here are not
      # always short and the annotation is read in a narrow column.
      - name: Upload the preview version
        run: |
          npm run deploy:preview -- \
            --tag "$(git rev-parse --short HEAD)" \
            --message "$(git log -1 --pretty=%s | cut -c1-80) · run ${{ github.run_number }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Summarise the preview link
        run: |
          {
            echo "### Preview"
            echo
            echo "<https://dev-proyect-ticket-manager.gmujica.workers.dev>"
            echo
            echo "Points at the staging API, so nothing here touches production data."
          } >> "$GITHUB_STEP_SUMMARY"

  # Production, and the only job that changes what the public URL serves.
  # Reached by merging into master, never by pushing to dev.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://proyect-ticket-manager.gmujica.workers.dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      # Same annotations as the preview job. On master the subject is usually
      # the merge commit's — "Merge pull request #14 from gmujica/dev" — which
      # is what makes the version findable from the PR it came from.
      - name: Deploy to production
        run: |
          npm run deploy:cf -- \
            --tag "$(git rev-parse --short HEAD)" \
            --message "$(git log -1 --pretty=%s | cut -c1-80) · run ${{ github.run_number }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
